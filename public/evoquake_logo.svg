<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 500 140" width="500" height="140">
  <!-- Light-theme logo: dark "Quake" + brand gradient, tagline removed,
       viewBox cropped to frame the mark + wordmark. -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5A4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5A4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Mark: pulse-wave inside a soft hex (life + seismic + AI) -->
  <g transform="translate(20,30)">
    <path d="M70 5 L130 35 L130 105 L70 135 L10 105 L10 35 Z"
          fill="none" stroke="url(#markGrad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Pulse / seismic wave -->
    <path d="M20 70 L42 70 L52 50 L62 95 L75 35 L88 100 L98 70 L120 70"
          fill="none" stroke="url(#markGrad)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Accent dot -->
    <circle cx="120" cy="70" r="5" fill="#10B981"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(180,0)">
    <text x="0" y="115"
          font-family="Helvetica, Arial, sans-serif"
          font-size="68" font-weight="700"
          letter-spacing="-2"
          fill="url(#brandGrad)">Evo<tspan fill="#211C16">Quake</tspan></text>
  </g>
</svg>
